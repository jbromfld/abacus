[project]
name = "abacus"
version = "0.1.0"
description = "A quiet place to plan your money"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "python-dotenv>=1,<2", "python-multipart>=0.0.18", "pdfplumber>=0.11,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/abacus"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
